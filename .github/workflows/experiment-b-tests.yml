name: Experiment B Python unit tests
on:
  push:
    paths:
      - 'experiment-b/**'
      - '.github/workflows/experiment-b-tests.yml'
  pull_request:
    paths:
      - 'experiment-b/**'
      - '.github/workflows/experiment-b-tests.yml'
concurrency:
  group: experiment-b-python-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated ML dependencies
        run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Unit test Experiment B without network or lab
        run: python -m unittest discover -s experiment-b -p "test_*.py" -v
