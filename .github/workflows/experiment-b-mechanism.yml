name: Experiment B real Kafka mechanism lab
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['experiment-b/mechanism-lab/**', '.github/workflows/experiment-b-mechanism.yml']
  pull_request:
    paths: ['experiment-b/mechanism-lab/**', '.github/workflows/experiment-b-mechanism.yml']
concurrency:
  group: experiment-b-mechanism-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mechanism-integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create disposable distinct credentials
        run: |
          for name in LAB_CONTROL_TOKEN LAB_ORACLE_TOKEN LAB_INTERNAL_TOKEN; do
            value="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Install model dependencies for synthetic-only training tests
        run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Validate Python test suite
        run: PYTHONPATH=engine python -m unittest discover -s experiment-b/mechanism-lab -p 'test_*.py' -v
      - name: Preregistration gate (fails on an unrecorded change after locking)
        working-directory: experiment-b/mechanism-lab
        run: python prereg_gate.py check
      - name: Pilot the fix-verification checks for real against this project's own dependencies
        run: PYTHONPATH=engine python experiment-b/mechanism-lab/verify_remediation.py
      - name: Start Kafka and separate enforcement JVMs
        working-directory: experiment-b/mechanism-lab
        run: docker compose up --build -d
      - name: Execute actual mechanism pilot
        working-directory: experiment-b/mechanism-lab
        run: python pilot.py --execute-lab --rps 25 --output reports/ci-mechanism-pilot.json
      - name: Assert observable action differences and regression
        working-directory: experiment-b/mechanism-lab
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("reports/ci-mechanism-pilot.json").read_text())
          cases={x["action"]:x for x in d["cases"]}
          assert set(cases)=={"resync_policy","restart_enforcer","gateway_restrict","monitor_only"}
          assert all(x["operations"]["attempts"] > 10 for x in cases.values())
          assert cases["monitor_only"]["after"]["oracle"]["all_revoked_access_denied"] is False
          # Under persistent consumer loss, republishing over the same
          # broken channel must NOT repair the stale enforcement cache.
          assert cases["resync_policy"]["after"]["oracle"]["all_revoked_access_denied"] is False
          assert cases["restart_enforcer"]["after"]["oracle"]["all_revoked_access_denied"] is True
          assert cases["restart_enforcer"]["after"]["verifier_scope"]["status"] == "VERIFIED"
          assert cases["resync_policy"]["after"]["verifier_scope"]["status"] == "NOT VERIFIED"
          assert cases["gateway_restrict"]["after"]["verifier_scope"]["status"] == "INDETERMINATE"
          assert cases["gateway_restrict"]["after"]["oracle"]["all_revoked_access_denied"] is False
          r=d["silent_regression"]
          assert r["pre_regression_oracle"]["all_revoked_access_denied"] is True
          assert r["post_regression_oracle"]["all_revoked_access_denied"] is False
          # Gateway restriction denies the protected operation for both
          # revoked and authorized test identities, producing real collateral cost.
          assert cases["gateway_restrict"]["operations"]["non_200_requests"] > 0
          omitted=d["omitted_enforcement_point"]
          assert omitted["gateway_only_looks_clean"] is True
          assert omitted["oracle"]["all_revoked_access_denied"] is False
          assert omitted["full_scope_verification_status"] == "INDETERMINATE"
          print("PASS: separate enforcers, Kafka fault, action effects and regression")
          PY
      - name: Exercise physical authority outage and fail-closed recovery constraints
        working-directory: experiment-b/mechanism-lab
        run: |
          python physical_faults.py --execute-lab --output reports/ci-authority-outage.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("reports/ci-authority-outage.json").read_text())
          assert result["outcome"] == "MECHANISM_CONSTRAINT_OBSERVED"
          assert result["resync_unavailable"] is True
          assert result["authority_still_unavailable"] is True
          assert result["enforcer_restart_ready_seconds"] >= 0
          print("PASS: external authority physically down through resync and local restart")
          PY
      - name: Verify consumer-only Kafka pause with live authority publication
        working-directory: experiment-b/mechanism-lab
        run: |
          python consumer_pause_smoke.py --execute-lab --output reports/ci-consumer-pause.json
          python - <<'PY'
          import json
          from pathlib import Path
          observed=json.loads(Path("reports/ci-consumer-pause.json").read_text())
          assert observed["pause_physically_observed"] is True
          assert observed["http_healthy_during_pause"] is True
          assert observed["broker_publish_accepted"] is True
          assert observed["handled_events_before"] == observed["handled_events_while_paused"]
          print("PASS: listener pause is physical, not a stopped HTTP JVM")
          PY
      - name: Generate grouped 100 by 4 by 3 mechanism experiment plan
        working-directory: experiment-b/mechanism-lab
        run: python plan.py --output plans/ci-mechanism
      - name: 'Execute repeated pilot: all three complexity strata and four fault families'
        working-directory: experiment-b/mechanism-lab
        run: |
          for start in 0 4 12 16 24 28 228 232 336 340; do
            python campaign.py --execute-lab --plan plans/ci-mechanism --records results/ci-mechanism --start "$start" --max-trials 4
          done
      - name: Audit 40 executed records across five configurations and four streams
        working-directory: experiment-b/mechanism-lab
        run: |
          python campaign.py --audit --plan plans/ci-mechanism --records results/ci-mechanism > reports/ci-campaign-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("reports/ci-campaign-audit.json").read_text())
          assert d["complete"] == 40 and d["missing"] == 1160
          assert d["partial"] == d["invalid"] == d["unexpected_files"] == 0
          assert not d["ready_for_training"]
          root=Path("results/ci-mechanism")
          id_sets=[]
          for stream in ("pre_action","verification","operations","oracle"):
              paths=list((root/stream).glob("*.json"))
              assert len(paths)==40, (stream, len(paths))
              id_sets.append({p.name for p in paths})
          assert all(items == id_sets[0] for items in id_sets)
          records=[json.loads(p.read_text()) for p in (root/"pre_action").glob("*.json")]
          assert len({r["configuration_id"] for r in records}) == 5
          assert {r["repeat"] for r in records} == {0,1}
          assert {r["experimental_conditions"]["fault_mode"] for r in records} == {
              "loss","delay","duplicate","reorder"
          }
          assert all(r["oracle_features_excluded"] for r in records)
          assert {r["complexity_stratum"] for r in records} == {
              "SIMPLE", "INTERACTION", "PARTIAL_VISIBILITY"
          }
          assert {r["routing_profile"] for r in records} >= {"balanced", "skewed_a"}
          frozen=[r for r in records if not r["decision_policy_metadata"]["restart_permitted"]]
          assert len(frozen)==8 and {r["configuration_id"] for r in frozen}=={"mechanism-028"}
          reorder=[r for r in records
                   if r["experimental_conditions"]["fault_mode"] == "reorder"]
          observed_pairs=[]
          for r in reorder:
              oracle=json.loads((root/"oracle"/(r["run_id"]+".json")).read_text())
              target=r["experimental_conditions"]["fault_target"]
              # Oracle entries use upstream URLs, not short service names.
              # Normalize the real URL host instead of claiming the fault was
              # exercised based on a mismatched node identifier.
              from urllib.parse import urlsplit
              selected=[x["admin"].get("reordered_event_pairs",0)
                        for x in oracle["after"]["targets"]
                        if urlsplit(x["node"]).hostname==target]
              assert len(selected)==1
              observed_pairs.extend(selected)
          assert any(n > 0 for n in observed_pairs), "Real reordered Kafka events were not observed"
          print("PASS: 40 genuine paired replays, repeated fault/freeze conditions, broker reordering observed")
          PY
      - name: Score the verifier against injected ground truth on the pilot records
        working-directory: experiment-b/mechanism-lab
        run: |
          python verifier_scoring.py --records results/ci-mechanism --output reports/ci-verifier-scoring.json
          python - <<'PY'
          import json
          r=json.load(open("reports/ci-verifier-scoring.json"))
          assert r["cases"] == 40 and r["with_post_action_telemetry"] > 0
          print(json.dumps({k: v["single_evidence"] | {"dual_false_VERIFIED": v["dual_evidence"]["false_VERIFIED"]}
                            for k, v in r["by_fault_and_action"].items() if k.endswith("/ALL")}, indent=1))
          PY
      - name: Remove restricted oracle trial files before artifact upload
        if: always()
        working-directory: experiment-b/mechanism-lab
        run: rm -rf plans/ci-mechanism results/ci-mechanism
      - name: Retain sanitized campaign summary without raw oracle or control secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-b-mechanism-pilot
          path: |
            experiment-b/mechanism-lab/reports/ci-campaign-audit.json
            experiment-b/mechanism-lab/reports/ci-verifier-scoring.json
          if-no-files-found: ignore
      - name: Shutdown and diagnostics
        if: always()
        working-directory: experiment-b/mechanism-lab
        run: |
          docker compose ps
          docker compose logs --tail=100
          docker compose down --remove-orphans --volumes

  controls:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create disposable distinct credentials
        run: |
          for name in LAB_CONTROL_TOKEN LAB_ORACLE_TOKEN LAB_INTERNAL_TOKEN; do
            value="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start Kafka and separate enforcement JVMs
        working-directory: experiment-b/mechanism-lab
        run: docker compose up --build -d
      - name: 'Positive and negative controls: 4 fault modes and no fault, 8 runs each, no action'
        working-directory: experiment-b/mechanism-lab
        run: python controls.py --execute-lab --output reports/controls.json
      - name: Check the controls and score the verifier on them
        working-directory: experiment-b/mechanism-lab
        run: |
          python - <<'PY'
          import json
          r=json.load(open("reports/controls.json"))
          assert len(r["runs"]) == 40
          s=r["summary"]
          print(json.dumps({m: {k: v for k, v in e.items() if k != "by_cell"} for m, e in s.items()}, indent=1))
          assert s["none"]["verdict"] == "VALID", "negative control reported exposed access"
          PY
          python verifier_scoring.py --controls reports/controls.json --output reports/controls-verifier-scoring.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-b-mechanism-controls
          path: |
            experiment-b/mechanism-lab/reports/controls.json
            experiment-b/mechanism-lab/reports/controls-verifier-scoring.json
          if-no-files-found: ignore
      - name: Shutdown and diagnostics
        if: always()
        working-directory: experiment-b/mechanism-lab
        run: |
          docker compose ps
          docker compose logs --tail=60
          docker compose down --remove-orphans --volumes
