name: Public training data probe

# Reachability, listings and API metadata only. Downloads nothing larger than
# a page or a script.

on:
  push:
    branches: [chore/probe-public-data]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe UQ RDM download chunk and API
        run: |
          for c in download-DFRITavk.js openFileDownload-uFmIzgZv.js view-DLsVmOBp.js; do
            curl -sSL -m 60 "https://rdm.uq.edu.au/assets/$c" -o c.js; echo "=== $c $(wc -c < c.js)"
            grep -o -E '.{0,160}(`/[a-z][^`]*`|api\.rdm).{0,200}' c.js | head -20 || true
          done
          for path in files/abd2f5d8-e268-4ff0-84fb-f2f7b3ca3e8f files/abd2f5d8-e268-4ff0-84fb-f2f7b3ca3e8f/download datasetfiles/abd2f5d8-e268-4ff0-84fb-f2f7b3ca3e8f v1/files/abd2f5d8-e268-4ff0-84fb-f2f7b3ca3e8f; do
            echo "=== api $path"; curl -sS -m 40 -o r.bin -w "%{http_code} %{size_download} %{content_type}\n" "https://api.rdm.uq.edu.au/$path" || true; head -c 600 r.bin; echo
          done
