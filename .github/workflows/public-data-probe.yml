name: Public training data probe

# Inspect candidate open datasets: size, hash, columns and label counts.
# Nothing is kept beyond the job.

on:
  push:
    branches: [chore/probe-public-data]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: HIKARI-2021 (Zenodo 6463389, CC BY 4.0)
        run: |
          curl -sSL -m 60 https://zenodo.org/api/records/6463389 | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['metadata'].get('license'),d['metadata'].get('version'));[print(f['key'],f['size'],f['checksum'],f['links']['self']) for f in d['files']]"
          url=$(curl -sSL -m 60 https://zenodo.org/api/records/6463389 | python3 -c "import json,sys;d=json.load(sys.stdin);print([f['links']['self'] for f in d['files'] if f['key']=='ALLFLOWMETER_HIKARI2021.csv.zip'][0])")
          curl -fsSL --retry 5 -m 900 -o h.zip "$url"; ls -l h.zip; sha256sum h.zip
          pip install -q pandas
          python3 - <<'PY'
          import zipfile, pandas as pd
          z = zipfile.ZipFile("h.zip")
          df = pd.read_csv(z.open("ALLFLOWMETER_HIKARI2021.csv"), nrows=5)
          print("columns_after_active", list(df.columns)[70:])
          print({c: str(t) for c, t in df.dtypes.items()})
          PY
