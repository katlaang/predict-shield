name: Public training data probe

# Reachability and size only: HEAD requests and directory listings. Downloads
# nothing larger than a listing.

on:
  push:
    branches: [chore/probe-public-data]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe UQ RDM bundle
        run: |
          curl -sSL -m 60 https://rdm.uq.edu.au/files/abd2f5d8-e268-4ff0-84fb-f2f7b3ca3e8f -o page.html
          js=$(grep -o 'src="[^"]*\.js"' page.html | head -1 | sed 's/src="//;s/"$//'); curl -sSL -m 60 "https://rdm.uq.edu.au$js" -o b.js; wc -c b.js
          for pat in '/api' 'download' 'baseURL' 'files/' 'apiUrl' 'https://[a-z0-9.-]*uq\.edu\.au[^"`'"'"' ]*'; do
            echo "=== $pat"; grep -o -E ".{0,90}$pat.{0,120}" b.js | sort -u | head -25
          done
      - name: Probe CIC-UNSW-NB15 (listing, headers, first 3 KB of each CSV)
        run: |
          base=http://cicresearch.ca/CICDataset/CIC-UNSW/
          curl -sSL -m 60 "$base" | sed -e 's/<[^>]*>/ /g' | tr -s ' ' | grep -v '^ *$' | head -40 || true
          for f in Readme.txt CICFlowMeter_out.csv Data.csv Label.csv; do
            for u in "$base$f" "${base}Dataset/$f"; do
              echo "=== $u"; curl -sSIL -m 40 "$u" | grep -i -E '^HTTP/|content-length|last-modified|etag' | tail -4 || true
            done
          done
          echo "=== Readme"; curl -sSL -m 60 "${base}Readme.txt" | head -60 || true
          for f in CICFlowMeter_out.csv Data.csv Label.csv; do echo "=== head $f"; curl -sSL -m 60 -r 0-3000 "$base$f" | head -c 3000; echo; done
