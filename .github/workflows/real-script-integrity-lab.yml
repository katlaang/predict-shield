name: Real script-integrity pilot

on:
  push:
    branches: [master]
    paths:
      - 'experiment-b/real-script-integrity-pilot/**'
      - 'engine/predict_shield/script_integrity.py'
      - 'engine/predict_shield/script_risk_proposer.py'
      - '.github/workflows/real-script-integrity-lab.yml'
  pull_request:
    paths:
      - 'experiment-b/real-script-integrity-pilot/**'
      - 'engine/predict_shield/script_integrity.py'
      - 'engine/predict_shield/script_risk_proposer.py'
      - '.github/workflows/real-script-integrity-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-script-integrity-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and its Chromium browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Validate lab-server and fetch-probe contracts before the real run
        working-directory: experiment-b/real-script-integrity-pilot
        env:
          PYTHONPATH: ../../engine
        run: python -m unittest test_real_script_integrity_pilot -v
      - name: Run the real pilot (real HTTP servers, real Chromium, real network capture)
        working-directory: experiment-b/real-script-integrity-pilot
        env:
          PYTHONPATH: ../../engine
        run: |
          python run_real_script_integrity_pilot.py --output /tmp/ps-real-script-integrity-pilot.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("/tmp/ps-real-script-integrity-pilot.json").read_text())
          s = p["summary"]
          assert s["negative_control_accepted"] is True
          assert s["malicious_tamper_caught_by_hash"] is True
          assert s["malicious_tamper_real_network_reach_confirmed"] is True, \
              "behavioral check must observe the real browser reaching the sink, not only a hash change"
          assert s["false_positive_occurred"] is False
          assert s["unregistered_domain_caught_despite_clean_hash"] is True
          V, N = "VERIFIED", "NOT VERIFIED"
          expected = {
              # channel: none, connect-src, all fetch directives, block script, SRI pin
              "fetch":      [N, V, V, V, V],
              "image":      [N, N, V, V, V],
              "form":       [N, N, V, V, V],
              "navigation": [N, N, N, V, V],
          }
          order = ["none_allow_vendor_only", "restrict_connect_src", "restrict_all_fetch_targets",
                   "block_vendor_script", "sri_pin"]
          m = s["containment_matrix_outcomes"]
          for channel, outcomes in expected.items():
              got = [m[channel][a] for a in order]
              assert got == outcomes, (channel, got, outcomes)
          # An empty capture or an unexercised compromise is never a pass.
          assert s["verifier_controls"] == {"G_instrumentation_not_live": "INDETERMINATE",
                                            "H_exposure_not_exercised": "INDETERMINATE"}, s["verifier_controls"]
          # SRI only works with vendor CORS, and blocks a benign update until the pin changes.
          assert s["sri_operating_costs"] == {"S1_clean_script_vendor_sends_cors": True,
                                              "S2_clean_script_vendor_without_cors": False,
                                              "S3_benign_update_before_pin_changed": False}
          d = s["scheduled_detection"]
          assert d["all_detected"] and d["max_seconds"] <= d["bound_seconds"], d
          print("PASS:", json.dumps(s, indent=1, sort_keys=True))
          PY
      - name: Retain the real evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-script-integrity-pilot-evidence
          path: /tmp/ps-real-script-integrity-pilot.json
          if-no-files-found: ignore
          retention-days: 30
