name: Real script-integrity pilot

on:
  push:
    branches: [master]
    paths:
      - 'experiment-b/real-script-integrity-pilot/**'
      - 'engine/predict_shield/script_integrity.py'
      - 'engine/predict_shield/script_risk_proposer.py'
      - '.github/workflows/real-script-integrity-lab.yml'
  pull_request:
    paths:
      - 'experiment-b/real-script-integrity-pilot/**'
      - 'engine/predict_shield/script_integrity.py'
      - 'engine/predict_shield/script_risk_proposer.py'
      - '.github/workflows/real-script-integrity-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-script-integrity-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and its Chromium browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Validate lab-server and fetch-probe contracts before the real run
        working-directory: experiment-b/real-script-integrity-pilot
        env:
          PYTHONPATH: ../../engine
        run: python -m unittest test_real_script_integrity_pilot -v
      - name: Run the real pilot (real HTTP servers, real Chromium, real network capture)
        working-directory: experiment-b/real-script-integrity-pilot
        env:
          PYTHONPATH: ../../engine
        run: |
          python run_real_script_integrity_pilot.py --output /tmp/ps-real-script-integrity-pilot.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("/tmp/ps-real-script-integrity-pilot.json").read_text())
          s = p["summary"]
          assert s["negative_control_accepted"] is True
          assert s["malicious_tamper_caught_by_hash"] is True
          assert s["malicious_tamper_real_network_reach_confirmed"] is True, \
              "behavioral check must observe the real browser reaching the sink, not only a hash change"
          assert s["false_positive_occurred"] is False
          assert s["unregistered_domain_caught_despite_clean_hash"] is True
          V, N = "VERIFIED", "NOT VERIFIED"
          expected = {
              # channel: none, connect-src, all fetch directives, block script, SRI pin
              "fetch":      [N, V, V, V, V],
              "image":      [N, N, V, V, V],
              "form":       [N, N, V, V, V],
              "navigation": [N, N, N, V, V],
          }
          order = ["none_allow_vendor_only", "restrict_connect_src", "restrict_all_fetch_targets",
                   "block_vendor_script", "sri_pin"]
          m = s["containment_matrix_outcomes"]
          for channel, outcomes in expected.items():
              got = [m[channel][a] for a in order]
              assert got == outcomes, (channel, got, outcomes)
          # An empty capture or an unexercised compromise is never a pass.
          assert s["verifier_controls"] == {"G_instrumentation_not_live": "INDETERMINATE",
                                            "H_exposure_not_exercised": "INDETERMINATE"}, s["verifier_controls"]
          # SRI only works with vendor CORS, and blocks a benign update until the pin changes.
          assert s["sri_operating_costs"] == {"S1_clean_script_vendor_sends_cors": True,
                                              "S2_clean_script_vendor_without_cors": False,
                                              "S3_benign_update_before_pin_changed": False}
          d = s["scheduled_detection"]
          assert d["all_detected"] and d["max_seconds"] <= d["bound_seconds"], d
          print("PASS:", json.dumps(s, indent=1, sort_keys=True))
          PY
      - name: Retain the real evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-script-integrity-pilot-evidence
          path: /tmp/ps-real-script-integrity-pilot.json
          if-no-files-found: ignore
          retention-days: 30

  real-local-model-proposer:
    # The containment proposer against a real model, served by a local
    # Ollama on loopback exactly as the lodash pilot serves its model.
    # The model's answers may vary; the structural safety properties the
    # runner checks may not.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start local model on loopback only
        run: |
          docker run --rm -d --name ps-script-local-ai \
            -e OLLAMA_NUM_PARALLEL=1 \
            -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then exit 0; fi
            if [ "$attempt" = 60 ]; then docker logs ps-script-local-ai; exit 1; fi
            sleep 2
          done
      - name: Install the real model and capture its installed digest
        run: |
          # A registry failure is an infrastructure failure, not a model verdict:
          # retry only the model fetch, never the safety checks.
          downloaded=false
          for attempt in 1 2 3 4 5; do
            if docker exec ps-script-local-ai ollama pull qwen3:0.6b; then downloaded=true; break; fi
            sleep 15
          done
          if [ "$downloaded" != "true" ]; then
            echo "No model fetched. Do not claim the proposer was tested against a real model."
            exit 1
          fi
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          tags = json.load(urllib.request.urlopen("http://127.0.0.1:11434/api/tags", timeout=10))
          matched = [m for m in tags.get("models", []) if m.get("name") == "qwen3:0.6b"]
          assert len(matched) == 1 and len(matched[0]["digest"]) == 64
          Path("/tmp/ps-script-model-digest.txt").write_text("sha256:" + matched[0]["digest"])
          PY
      - name: Run the containment proposer against the real model
        working-directory: experiment-b/real-script-integrity-pilot
        env:
          PYTHONPATH: ../../engine
        run: |
          python run_live_model_proposer.py --provider ollama --model qwen3:0.6b \
            --model-digest "$(cat /tmp/ps-script-model-digest.txt)" \
            --output /tmp/ps-script-local-model-proposer.json
      - name: Retain the model's recorded decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-script-local-model-proposer-evidence
          path: /tmp/ps-script-local-model-proposer.json
          if-no-files-found: ignore
          retention-days: 30
