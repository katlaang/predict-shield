name: Superviz25-SQL external test

# stage=inspect  download (publisher md5 checked), print structure from the training split only
# stage=develop  fit on the training split only, freeze, commit the freeze
# stage=test     verify the freeze, score the test split once, commit the report

on:
  push:
    branches: [feat/superviz25-sql]
    paths: ['experiment-b/superviz25-sql/**', '.github/workflows/superviz25-sql.yml']
  workflow_dispatch:
    inputs:
      stage:
        description: 'inspect, develop, test or baselines'
        default: 'inspect'
      freeze_sha256:
        description: 'test stage only'
        default: ''

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download with publisher checksum
        run: |
          python experiment-b/open-datasets/registry.py download --dataset superviz25-sql-v2 \
            --file dataset.csv --output "$RUNNER_TEMP/superviz.csv" --max-mb 1200
          sha256sum "$RUNNER_TEMP/superviz.csv"
      - run: python experiment-b/superviz25-sql/inspect_train.py "$RUNNER_TEMP/superviz.csv"

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'scikit-learn==1.7.2' 'numpy==2.3.4'
      - run: pip install 'libinjection-python==1.1.6'
      - working-directory: experiment-b/superviz25-sql
        run: python -m unittest test_model_sql test_baselines -v

  run:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.stage == 'develop' || github.event.inputs.stage == 'test')
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'scikit-learn==1.7.2' 'numpy==2.3.4'
      - name: Download with publisher checksum
        run: |
          python experiment-b/open-datasets/registry.py download --dataset superviz25-sql-v2 \
            --file dataset.csv --output "$RUNNER_TEMP/superviz.csv" --max-mb 1200
      - name: Develop on the training split and freeze
        if: github.event.inputs.stage == 'develop'
        working-directory: experiment-b/superviz25-sql
        run: |
          test ! -f frozen/freeze.json
          python model_sql.py develop --data "$RUNNER_TEMP/superviz.csv" --out-dir frozen
          git config user.name katlaang
          git config user.email katlaang@users.noreply.github.com
          git add frozen
          git commit -m "superviz25-sql: record the freeze from develop run ${{ github.run_id }} before any test row is read"
          git push origin HEAD:${{ github.ref_name }}
      - name: Score the test split once
        if: github.event.inputs.stage == 'test'
        working-directory: experiment-b/superviz25-sql
        run: |
          test ! -f frozen/test-report.json
          python model_sql.py test --data "$RUNNER_TEMP/superviz.csv" --frozen-dir frozen \
            --expected-freeze-sha256 "${{ github.event.inputs.freeze_sha256 }}" --output frozen/test-report.json
          git config user.name katlaang
          git config user.email katlaang@users.noreply.github.com
          git add frozen/test-report.json
          git commit -m "superviz25-sql: record the single test run (run ${{ github.run_id }})"
          git push origin HEAD:${{ github.ref_name }}

  baselines:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'baselines'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'scikit-learn==1.7.2' 'numpy==2.3.4' 'libinjection-python==1.1.6'
      - name: Download with publisher checksum
        run: |
          python experiment-b/open-datasets/registry.py download --dataset superviz25-sql-v2 \
            --file dataset.csv --output "$RUNNER_TEMP/superviz.csv" --max-mb 1200
      - name: Fixed sample, frozen detector, libinjection, supervised reference
        working-directory: experiment-b/superviz25-sql
        run: |
          test ! -f reports/baselines.json
          mkdir -p "$RUNNER_TEMP/b"
          D="$RUNNER_TEMP/superviz.csv"; B="$RUNNER_TEMP/b"
          python baselines.py sample --data "$D" --out "$B/sample.npz"
          python baselines.py ours --data "$D" --frozen-dir frozen \
            --expected-freeze-sha256 e3423d8bcba6624e85a9ca08f37608d159e8bb9a7153b855a7f9fe3018f0d8aa --out "$B/frozen_v3_method.npz"
          python baselines.py libinj --data "$D" --out "$B/libinjection.npz"
          python baselines.py supervised --data "$D" --sample "$B/sample.npz" --out "$B/supervised_reference.npz"
      - name: OWASP CRS at paranoia levels 1 to 4
        working-directory: experiment-b/superviz25-sql
        run: |
          D="$RUNNER_TEMP/superviz.csv"; B="$RUNNER_TEMP/b"
          mkdir -p /tmp/backend && echo ok > /tmp/backend/index.html
          (cd /tmp/backend && python -m http.server 8000 >/dev/null 2>&1 &)
          docker pull owasp/modsecurity-crs:nginx
          docker inspect --format '{{index .RepoDigests 0}}' owasp/modsecurity-crs:nginx | tee "$B/crs-image-digest.txt"
          for L in 1 2 3 4; do
            docker rm -f crs >/dev/null 2>&1 || true
            docker run -d --name crs --network host -e PORT=8080 -e BACKEND=http://127.0.0.1:8000 \
              -e BLOCKING_PARANOIA=$L -e DETECTION_PARANOIA=$L -e PARANOIA=$L -e ANOMALY_INBOUND=5 \
              owasp/modsecurity-crs:nginx
            for i in $(seq 1 60); do curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/?q=Vieques' | grep -q 200 && break; sleep 2; done
            echo "level $L probe: $(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/?q=Vieques') / $(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/?q=1%27%20OR%20%271%27%3D%271')"
            python baselines.py crs --data "$D" --sample "$B/sample.npz" --url http://127.0.0.1:8080/ --level $L --out "$B/owasp_crs_pl$L.npz"
          done
      - name: Report and commit
        working-directory: experiment-b/superviz25-sql
        run: |
          D="$RUNNER_TEMP/superviz.csv"; B="$RUNNER_TEMP/b"
          mkdir -p reports
          python baselines.py report --data "$D" --sample "$B/sample.npz" --inputs "$B"/frozen_v3_method.npz \
            "$B"/libinjection.npz "$B"/supervised_reference.npz "$B"/owasp_crs_pl1.npz "$B"/owasp_crs_pl2.npz \
            "$B"/owasp_crs_pl3.npz "$B"/owasp_crs_pl4.npz --output reports/baselines.json
          cp "$B/crs-image-digest.txt" reports/crs-image-digest.txt
          git config user.name katlaang
          git config user.email katlaang@users.noreply.github.com
          git add reports
          git commit -m "superviz25-sql: record the baseline comparison (run ${{ github.run_id }})"
          git push origin HEAD:${{ github.ref_name }}
