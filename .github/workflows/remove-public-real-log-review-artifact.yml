name: One-time privacy removal of exposed real-log review artifact

# Intentionally narrow: only the change adding this workflow on master
# activates deletion of ONE verified artifact from ONE historic run.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/remove-public-real-log-review-artifact.yml'

permissions:
  contents: read
  actions: write

jobs:
  delete-exposed-request-targets:
    if: github.repository == 'katlaang/predict-shield' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ARTIFACT_ID: '15207468752'
      TARGET_RUN_ID: '46018576222'
    steps:
      - name: Verify original artifact identity and delete only that artifact
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}"
          # A 404 is acceptable only if a prior cleanup already removed it.
          status="$(gh api -i "$endpoint" 2>&1 || true)"
          if grep -Fq 'HTTP/2.0 404' <<<"$status" || grep -Fq 'HTTP/1.1 404' <<<"$status"; then
            echo "Exact target artifact already absent; nothing to delete."
            exit 0
          fi
          # Retrieve fresh metadata as JSON, and refuse deleting an artifact
          # whose recorded workflow run or name differs from the reviewed item.
          gh api "$endpoint" > "$RUNNER_TEMP/artifact-metadata.json"
          jq -e --argjson id "$TARGET_ARTIFACT_ID" --argjson run "$TARGET_RUN_ID" \
            '.id == $id and .name == "real-logs-review-sample" and .workflow_run.id == $run' \
            "$RUNNER_TEMP/artifact-metadata.json" >/dev/null
          gh api --method DELETE "$endpoint" >/dev/null
          echo "Removed exposed review artifact ID $TARGET_ARTIFACT_ID from GitHub Actions."
          # Never upload or print historic request targets, parameters or agents.
