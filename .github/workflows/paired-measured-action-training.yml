name: Train measured action benefit with group-isolated validation
on:
  pull_request:
    paths:
      - 'experiment-b/mechanism-lab/paired_action_value_training.py'
      - 'experiment-b/mechanism-lab/test_paired_action_value_training.py'
      - '.github/workflows/paired-measured-action-training.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired-action-training:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned machine-learning research dependencies
        run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Check policy gates, paired-label integrity and group boundaries
        working-directory: experiment-b/mechanism-lab
        run: python -m unittest test_paired_action_value_training -v
      - name: Retrieve only the five existing audited physical training shards
        uses: actions/download-artifact@v4
        with:
          repository: katlaang/predict-shield
          run-id: 43629488209
          github-token: ${{ github.token }}
          pattern: v3-physical-measured-shard-*
          path: /tmp/ps-v3-research-shards
          merge-multiple: false
      - name: Repack audited archives without modifying or inspecting outcomes
        run: |
          set -euo pipefail
          mkdir -p /tmp/ps-v3-zip
          for shard in 0 1 2 3 4; do
            source="/tmp/ps-v3-research-shards/v3-physical-measured-shard-${shard}"
            test -s "$source/shard-${shard}.json"
            test -s "$source/shard-${shard}.sha256"
            (cd "$source" && zip -q "/tmp/ps-v3-zip/shard-${shard}.zip" \
              "shard-${shard}.json" "shard-${shard}.sha256")
          done
      - name: Train the paired-benefit policy from real physical outcomes
        working-directory: experiment-b/mechanism-lab
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python paired_action_value_training.py \
            --shard-zips /tmp/ps-v3-zip/shard-0.zip \
                         /tmp/ps-v3-zip/shard-1.zip \
                         /tmp/ps-v3-zip/shard-2.zip \
                         /tmp/ps-v3-zip/shard-3.zip \
                         /tmp/ps-v3-zip/shard-4.zip \
            --report /tmp/ps-paired-action-development-report.json \
            --model-bundle /tmp/ps-paired-action-exploratory-model.joblib
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/ps-paired-action-development-report.json').read_text())
          assert r["original_measured_action_replays"]==1200
          assert r["historical_train_action_rows"]==720
          assert r["historical_calibration_actions"]==240
          assert r["matched_action_improvement_samples"]==540
          assert r["original_test_labels_scored"] is False
          assert r["preaction_operator_signals_only"] is True
          assert r["claims"]["independent_confirmatory_ai_superiority"] is False
          assert r["claims"]["model_calibrated_for_autonomous_execution"] is False
          assert len(r["development"]["five_grouped_training_folds"])==5
          assert len(r["calibration_research_diagnostics"]["paired_comparisons"])==7
          assert Path('/tmp/ps-paired-action-exploratory-model.joblib').stat().st_size>1000
          print("Completed actual measured learning without confirmatory test reuse")
          PY
      - name: Retain trained model fingerprint and full actual results including any negative ones
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paired-real-physical-action-value-model-and-historical-validation
          path: |
            /tmp/ps-paired-action-development-report.json
            /tmp/ps-paired-action-exploratory-model.joblib
          retention-days: 30
