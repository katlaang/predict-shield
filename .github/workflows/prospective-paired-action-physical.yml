name: Prospective frozen AI vs seven rules on 192 new physical JVM/Kafka actions
on:
  pull_request:
    paths:
      - 'experiment-b/mechanism-lab/prospective_action_physical_shard.py'
      - 'experiment-b/mechanism-lab/score_prospective_paired_actions.py'
      - 'experiment-b/mechanism-lab/test_prospective_paired_actions.py'
      - '.github/workflows/prospective-paired-action-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: prospective-paired-action-physical-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  validate-frozen-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Validate exact 24 unseen configurations, action selection and source isolation
        working-directory: experiment-b/mechanism-lab
        run: python -m unittest test_prospective_paired_actions test_paired_action_value_training -v
  execute-new-physical-configurations:
    needs: validate-frozen-manifest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original physical telemetry and model parsing dependencies
        run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Generate three distinct local-only control/oracle credentials
        run: |
          for name in LAB_CONTROL_TOKEN LAB_ORACLE_TOKEN LAB_INTERNAL_TOKEN; do
            token="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
            echo "::add-mask::$token"
            echo "$name=$token" >> "$GITHUB_ENV"
          done
      - name: Start disposable real Kafka, separate Java enforcers, gateway and oracle
        working-directory: experiment-b/mechanism-lab
        run: |
          for attempt in 1 2 3; do
            if docker compose up --build -d; then exit 0; fi
            docker compose down --volumes --remove-orphans || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt*8)); fi
          done
          exit 1
      - name: Execute and independently audit 64 freshly configured physical defense replays
        working-directory: experiment-b/mechanism-lab
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python prospective_action_physical_shard.py \
            --execute-disposable-lab \
            --shard "$SHARD" \
            --root "/tmp/ps-fresh-physical-private-$SHARD" \
            --output "reports/prospective-physical-shard-$SHARD.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          shard=int(os.environ["SHARD"])
          p=Path(f"reports/prospective-physical-shard-{shard}.json")
          r=json.loads(p.read_text())
          assert r["actual_physical_action_replays"]==64
          assert r["independent_new_configurations"]==8
          assert r["physical_four_stream_audit"] is True
          assert r["raw_privileged_oracle_data_uploaded"] is False
          assert len(r["sanitized_new_measured_rows"])==64
          print("Measured fresh physical actions and separate oracle:",len(r["sanitized_new_measured_rows"]))
          PY
      - name: Upload only sanitized actual measurements, even if AI may later lose
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: new-paired-action-real-physical-shard-${{ matrix.shard }}
          path: experiment-b/mechanism-lab/reports/prospective-physical-shard-${{ matrix.shard }}.json
          retention-days: 30
      - name: Destroy private Oracle action logs and disposable Kafka/JVMs
        if: always()
        working-directory: experiment-b/mechanism-lab
        run: |
          rm -rf "/tmp/ps-fresh-physical-private-${{ matrix.shard }}" || true
          docker compose down --volumes --remove-orphans || true
  score-frozen-policy-vs-strong-baselines:
    needs: execute-new-physical-configurations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching trained-model read-only dependencies
        run: python -m pip install -r experiment-b/requirements-ml.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: new-paired-action-real-physical-shard-*
          path: /tmp/ps-new-physics
          merge-multiple: true
      - name: Retrieve the exact frozen model trained BEFORE running any new physical case
        uses: actions/download-artifact@v4
        with:
          repository: katlaang/predict-shield
          run-id: 43682077804
          github-token: ${{ github.token }}
          name: paired-real-physical-action-value-model-and-historical-validation
          path: /tmp/ps-frozen-paired-model
      - name: Score all 192 independently measured action outcomes without retraining
        working-directory: experiment-b/mechanism-lab
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python score_prospective_paired_actions.py \
            --shards /tmp/ps-new-physics/prospective-physical-shard-0.json \
                     /tmp/ps-new-physics/prospective-physical-shard-1.json \
                     /tmp/ps-new-physics/prospective-physical-shard-2.json \
            --frozen-model /tmp/ps-frozen-paired-model/ps-paired-action-exploratory-model.joblib \
            --training-report /tmp/ps-frozen-paired-model/ps-paired-action-development-report.json \
            --output /tmp/ps-actual-prospective-physical-policy-comparison.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/ps-actual-prospective-physical-policy-comparison.json").read_text())
          assert r["physical_action_replays"]==192
          assert r["independent_new_lab_configurations"]==24
          assert r["training_test_config_ids_disjoint"] is True
          assert r["test_labels_used_for_training_model_threshold_or_rule_selection"] is False
          assert r["locked_strong_non_ai_baseline"]=="fixed_monitor"
          assert len(r["comparisons_against_seven_registered_rules"])==7
          assert len(r["observed_paired_test_decisions"])==48
          assert r["autonomous_actions_executed_by_ai"] is False
          assert r["external_critical_infrastructure_effectiveness"] is False
          print("Preserved complete positive, tied or negative physical AI-v-rule result")
          PY
      - name: Retain actual full paired decisions, uncertainty, error budgets and confidence intervals
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prospectively-frozen-ai-vs-seven-rules-fresh-192-physical-results
          path: /tmp/ps-actual-prospective-physical-policy-comparison.json
          retention-days: 30
