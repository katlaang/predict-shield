name: Advisory-reading model comparison (120 real advisories)
on:
  pull_request:
    paths:
      - 'experiment-a/advisory-reading/**'
      - 'engine/predict_shield/advisory_reader.py'
      - 'engine/predict_shield/advisory_eval.py'
      - 'engine/predict_shield/language_model.py'
      - '.github/workflows/advisory-reading-model-comparison.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Optional: evaluate only the first N advisories (omit for the full 120). For a quick exploratory signal, not a replacement for the preregistered full-120 run.'
        required: false
permissions:
  contents: read
jobs:
  advisory-reading-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the harness and the rule baseline against the committed corpus
        run: PYTHONPATH=engine:engine/tests python -m unittest tests.test_versions tests.test_language_model tests.test_advisory_reader tests.test_advisory_eval -v
      - name: Start CPU-only local Ollama with one loaded model at a time
        # The previous 7 GiB cap was too tight for the 4.9 GB Foundation-Sec-8B
        # Q4_K_M weights plus Ollama's own runtime and inference buffers on this
        # public-repo runner's 16 GiB total: the container's OOM killer took the
        # Ollama process down partway through that model's evaluation, and every
        # request after that failed with a flat connection refusal, not a model
        # answer. 12 GiB still leaves headroom for the runner's own OS and the
        # Python harness process outside the container.
        run: |
          docker run --rm -d --name ps-advisory-comparison \
            --memory=12g --memory-swap=12g \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 \
            -e OLLAMA_CONTEXT_LENGTH=4096 \
            -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then exit 0; fi
            if [ "$attempt" = 60 ]; then docker logs ps-advisory-comparison; exit 1; fi
            sleep 2
          done
      - name: Pull the baseline and the security-focused model, same digests as the other comparisons
        run: |
          docker exec ps-advisory-comparison ollama pull qwen3:0.6b
          docker exec ps-advisory-comparison ollama pull hf.co/fdtn-ai/Foundation-Sec-8B-Reasoning-Q4_K_M-GGUF:Q4_K_M
          # A pull succeeding says nothing about whether the server is still up
          # afterward; confirm it explicitly so a crashed container fails the
          # job here, loudly, instead of silently turning into 120 identical
          # "connection refused" abstentions in the comparison step below.
          curl -fsS http://127.0.0.1:11434/api/version >/dev/null || {
            echo "::error::Ollama server is not responding after pulling both models"
            docker logs ps-advisory-comparison
            exit 1
          }
      - name: Evaluate both installed models on the committed advisories (optionally a subset)
        env:
          PYTHONPATH: engine
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          mkdir -p experiment-a/advisory-reading/recordings
          ARGS=()
          if [ -n "$LIMIT" ]; then
            ARGS+=(--limit "$LIMIT")
            echo "::notice::Running a $LIMIT-advisory subset, not the full 120. This is an exploratory signal, not the preregistered primary result."
          fi
          python -m predict_shield.advisory_eval \
            --model ollama:qwen3:0.6b \
            --model ollama:hf.co/fdtn-ai/Foundation-Sec-8B-Reasoning-Q4_K_M-GGUF:Q4_K_M \
            --record-dir experiment-a/advisory-reading/recordings \
            --output experiment-a/advisory-reading/model-results.json \
            "${ARGS[@]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("experiment-a/advisory-reading/model-results.json").read_text())
          limit = os.environ.get("LIMIT")
          expected_total = min(int(limit), 120) if limit else 120
          assert report["advisories"] == expected_total, (report["advisories"], expected_total)
          for name, result in report["readers"].items():
              summary = result["summary"]["all"]
              assert summary["correct"] + summary["wrong"] + summary["no_answer"] == expected_total
              a, n = result["summary"]["answerable"], result["summary"]["not_answerable"]
              print(name, "answerable correct:", a["correct"], f"/ {a['advisories']}, wrong:", a["wrong"],
                    f"| not-answerable wrong:", n["wrong"], f"/ {n['advisories']}")
          if limit:
              print(f"Subset run ({expected_total} of 120 advisories): exploratory signal only.")
          print("No model result is cherry-picked here; both models' full summaries are in the report.")
          PY
      - name: Archive the full report and every model exchange for replay and audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: advisory-reading-120-model-comparison
          path: |
            experiment-a/advisory-reading/model-results.json
            experiment-a/advisory-reading/recordings/
          retention-days: 30
      - name: Dispose of the model container
        if: always()
        run: |
          docker rm -f ps-advisory-comparison 2>/dev/null || true
