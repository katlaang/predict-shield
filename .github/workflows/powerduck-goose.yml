name: PowerDuck GOOSE detector

on:
  push:
    branches: [feat/powerduck-goose-detector]
    paths: ['experiment-b/powerduck/**', '.github/workflows/powerduck-goose.yml']
  workflow_dispatch:
    inputs:
      stage:
        description: 'inspect, develop or test'
        default: 'inspect'

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'push' || github.event.inputs.stage == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download from Zenodo and print the layout
        run: |
          for attempt in 1 2 3 4 5; do
            curl -sS -m 60 -H 'Accept: application/json' -A 'predict-shield-ci' https://zenodo.org/api/records/6724225 -o rec.json || true
            python3 -c "import json;json.load(open('rec.json'))" 2>/dev/null && break
            echo "record not JSON yet: $(head -c 200 rec.json)"; sleep $((attempt * 15))
          done
          python3 -c "import json;d=json.load(open('rec.json'));print(d['metadata']['title']);print(d['metadata'].get('license'));[print(f['key'],f['size'],f.get('checksum'),f['links']['self']) for f in d['files']]" || true
          curl -fsSL --retry 5 --retry-all-errors -m 300 -A 'predict-shield-ci' -o "$RUNNER_TEMP/powerduck.zip" \
            "https://zenodo.org/records/6724225/files/dataset.zip?download=1"
          python3 experiment-b/powerduck/inspect_archive.py "$RUNNER_TEMP/powerduck.zip"
