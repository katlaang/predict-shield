name: Graph-aware telecom risk model contracts
on:
  pull_request:
    paths:
      - 'engine/predict_shield/graph_risk.py'
      - 'engine/tests/test_graph_risk.py'
      - 'experiment-b/telecom-topology/graph_risk_training.py'
      - 'experiment-b/telecom-topology/test_graph_risk_training.py'
      - '.github/workflows/telecom-graph-risk-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=engine python -m unittest discover -s engine/tests -v
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Test grouped model training
        working-directory: experiment-b/telecom-topology
        run: PYTHONPATH=../../engine python -m unittest test_graph_risk_training -v
