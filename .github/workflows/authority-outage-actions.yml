name: Four physical actions under policy-authority outage (exploratory)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiment-b/mechanism-lab/authority_outage_actions.py'
      - 'experiment-b/mechanism-lab/test_authority_outage_actions.py'
      - 'experiment-b/mechanism-lab/outage_timed_measure.py'
      - 'experiment-b/mechanism-lab/test_outage_timed_measure.py'
      - 'experiment-b/mechanism-lab/outage_interval_diagnostic.py'
      - 'experiment-b/mechanism-lab/test_outage_interval_diagnostic.py'
      - '.github/workflows/authority-outage-actions.yml'
permissions:
  contents: read
jobs:
  physical-action-observations:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test measurement contracts
        working-directory: experiment-b/mechanism-lab
        run: python -m unittest test_authority_outage_witness test_authority_outage_actions test_outage_timed_measure test_outage_interval_diagnostic -v
      - name: Create separate disposable lab credentials
        run: |
          for name in LAB_CONTROL_TOKEN LAB_ORACLE_TOKEN LAB_INTERNAL_TOKEN; do
            value="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start isolated physical lab, retry transient Maven Central failures
        working-directory: experiment-b/mechanism-lab
        run: |
          for attempt in 1 2 3; do
            if docker compose up --build -d; then
              echo "Disposable Java/Kafka lab build succeeded"
              exit 0
            fi
            echo "Lab build attempt ${attempt}/3 failed"
            docker compose down --remove-orphans --volumes || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 8)); fi
          done
          echo "Lab build failed after three attempts"
          exit 1
      - name: Exercise four actual interventions and retain UNKNOWN policy truth
        working-directory: experiment-b/mechanism-lab
        run: |
          python authority_outage_actions.py --execute-lab --output reports/ci-outage-actions.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/ci-outage-actions.json").read_text())
          assert r["physical_action_replays"] == 4
          assert r["time_integrated_gateway_probes_measured"] is True
          for item in r["results"]:
              timed=item["timed_observations"]
              exp=timed["revoked_gateway_exposure"]
              assert exp["valid_probe_count"] >= 2
              assert 0 <= exp["exposure_fraction_lower_bound"] <= exp["exposure_fraction_upper_bound"] <= 1
              assert timed["authorized_protected"]["requests"] >= 1
              assert timed["legitimate_endpoint"]["requests"] >= 1
              assert timed["policy_verification_from_this_measurement"]=="NOT_EVALUATED"
          assert r["decision_value_computed"] is False
          assert r["v31_feasibility_evaluated"] is False
          assert {x["action"] for x in r["results"]} == {
              "resync_policy","restart_enforcer","gateway_restrict","monitor_only"}
          assert all(x["policy_truth"]=="UNKNOWN"
                     and x["verification_status"]=="INDETERMINATE"
                     and len(x["witness_sha256"])==64 for x in r["results"])
          for x in r["results"]:
              print(x["action"], x["action_observation"]["action_status"],
                    "allow_lower",x["observed_allow_fraction_lower_bound"],
                    "allow_upper",x["observed_allow_fraction_upper_bound"])
          print("PASS: physical outage observations, no fabricated decision utility")
          PY
      - name: Evaluate bounded exploratory intervals without selecting a winner by point estimate
        working-directory: experiment-b/mechanism-lab
        run: |
          python outage_interval_diagnostic.py \
            --physical-report reports/ci-outage-actions.json \
            --error-budget-requests 25 --restart-permitted \
            --output reports/ci-outage-interval-diagnostic.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("reports/ci-outage-interval-diagnostic.json").read_text())
          assert x["status"] == "EXPLORATORY_INTERVALS_ONLY"
          assert x["not_a_frozen_v31_primary_utility"] is True
          assert x["not_ai_training_or_inference"] is True
          assert x["not_v31_feasibility_or_campaign_authorization"] is True
          assert len(x["action_intervals"]) == 4
          for row in x["action_intervals"]:
              assert row["cost_lower_bound"] <= row["cost_upper_bound"]
          print("PASS: conservative intervals computed; no confirmed AI effect")
          PY
      - name: Upload only summarized observations without raw oracle truth
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: physical-authority-outage-action-observations
          path: |
            experiment-b/mechanism-lab/reports/ci-outage-actions.json
            experiment-b/mechanism-lab/reports/ci-outage-interval-diagnostic.json
      - name: Shut down disposable lab
        if: always()
        working-directory: experiment-b/mechanism-lab
        run: docker compose down --remove-orphans --volumes
