name: Telecom AI link discovery grouped evaluation
on:
  pull_request:
    paths:
      - 'experiment-b/telecom-topology/link_learning.py'
      - 'experiment-b/telecom-topology/test_link_learning.py'
      - '.github/workflows/telecom-link-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Run group isolation and actual model fit tests
        working-directory: experiment-b/telecom-topology
        run: python -m unittest test_link_learning -v
