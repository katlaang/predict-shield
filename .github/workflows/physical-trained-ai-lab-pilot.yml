name: Real measured-model lab AI action pilot
on:
  pull_request:
    paths:
      - 'experiment-b/mechanism-lab/train_physical_lab_bundle.py'
      - 'experiment-b/mechanism-lab/physical_ai_execution_pilot.py'
      - '.github/workflows/physical-trained-ai-lab-pilot.yml'
      - 'docs/research/PHYSICAL_TRAINED_AI_PILOT_PROTOCOL.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train-and-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: experiment-b/mechanism-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install training dependencies
        run: python -m pip install -r ../requirements-ml.txt
      - name: Fetch five original independently audited physical study shards
        uses: actions/download-artifact@v4
        with:
          run-id: 43629488209
          github-token: ${{ github.token }}
          pattern: v3-physical-measured-shard-*
          path: /tmp/physical-ai-original-shards
          merge-multiple: false
      - name: Repackage original SHA-verified shards without editing records
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          for index in range(5):
              folder=Path(f'/tmp/physical-ai-original-shards/v3-physical-measured-shard-{index}')
              if not (folder/f'shard-{index}.json').exists():
                  raise RuntimeError('Original independent physical shard missing')
              with zipfile.ZipFile(f'/tmp/physical-ai-shard-{index}.zip','x') as archive:
                  for filename in (f'shard-{index}.json',f'shard-{index}.sha256'):
                      archive.write(folder/filename,arcname=filename)
          PY
      - name: Fit model on original measured train and calibration groups, preserving test results
        run: |
          python train_physical_lab_bundle.py \
            --shard-zips /tmp/physical-ai-shard-0.zip /tmp/physical-ai-shard-1.zip \
              /tmp/physical-ai-shard-2.zip /tmp/physical-ai-shard-3.zip /tmp/physical-ai-shard-4.zip \
            --model reports/physical-model.joblib --report reports/training-provenance.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/training-provenance.json').read_text())
          assert r['actual_physical_measurements']==1200
          assert r['original_train_groups']==60
          assert r['original_calibration_groups']==20
          assert r['new_independent_test_groups']==0
          assert r['independent_superiority_claim'] is False
          print('Model trained on original measured source. No new superiority evidence.')
          PY
      - name: Start isolated Java and Kafka mechanism laboratory
        run: |
          export LAB_CONTROL_TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
          export LAB_ORACLE_TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
          export LAB_INTERNAL_TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
          printf 'LAB_CONTROL_TOKEN=%s\nLAB_ORACLE_TOKEN=%s\nLAB_INTERNAL_TOKEN=%s\n' "$LAB_CONTROL_TOKEN" "$LAB_ORACLE_TOKEN" "$LAB_INTERNAL_TOKEN" > .env
          docker compose -p psailab up -d --build
      - name: Run one predeclared fresh physical model-to-action case and retain all outcomes
        env:
          PYTHONPATH: ../../engine
        run: |
          set -a
          . ./.env
          set +a
          MODEL_SHA256="$(sha256sum reports/physical-model.joblib | cut -d ' ' -f 1)"
          python physical_ai_execution_pilot.py \
            --project psailab --model reports/physical-model.joblib \
            --trusted-sha256 "$MODEL_SHA256" \
            --output reports/physical-ai-case.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/physical-ai-case.json').read_text())
          assert report['laboratory_only'] is True
          assert report['new_independent_superiority_evidence'] is False
          assert report['execution']['status']
          assert report['recommendation']['model_fingerprint'] == report['model_training_fingerprint']
          print('Recorded all model decisions and post-action results, including abstentions.')
          PY
      - name: Retain physical trained AI pilot and model provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: measured-trained-ai-physical-lab-pilot
          path: |
            experiment-b/mechanism-lab/reports/training-provenance.json
            experiment-b/mechanism-lab/reports/physical-ai-case.json
          retention-days: 30
      - name: Dispose isolated Docker lab and temporary secrets
        if: always()
        run: |
          docker compose -p psailab down -v --remove-orphans || true
          rm -f .env
          rm -rf /tmp/physical-ai-original-shards /tmp/physical-ai-shard-*.zip
          rm -f reports/physical-model.joblib
