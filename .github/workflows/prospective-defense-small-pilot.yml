name: New-configuration physical defense pilot (non-confirmatory)

on:
  # Physical trials run for trusted same-repository PRs changing this workflow.
  # Existing historical evidence is never relabeled as fresh confirmation.
  workflow_dispatch:
  pull_request:
    paths:
      - "experiment-b/mechanism-lab/PROSPECTIVE_SMALL_PILOT_V1.md"
      - "experiment-b/mechanism-lab/new_configuration_pilot.py"
      - "experiment-b/mechanism-lab/test_new_configuration_pilot.py"
      - "experiment-b/mechanism-lab/pilot.py"
      - "experiment-b/mechanism-lab/test_pilot.py"
      - "experiment-b/mechanism-lab/paired_defense_eval.py"
      - ".github/workflows/prospective-defense-small-pilot.yml"

permissions:
  contents: read

jobs:
  admission-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check new-configuration data join and all negative fixtures
        working-directory: experiment-b/mechanism-lab
        run: python -m unittest test_new_configuration_pilot test_pilot -v

  new-configuration-physical-pilot:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: admission-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: experiment-b/mechanism-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned historical model libraries
        run: python -m pip install "scikit-learn==1.7.2" "numpy==2.3.4" "joblib==1.5.2"
      - name: Retrieve completed historical 1200-trial records, not old test decisions
        uses: actions/download-artifact@v4
        with:
          name: mechanism-scored-records
          repository: katlaang/predict-shield
          run-id: 44879497946
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/historical
      - name: Freeze historical trained model BEFORE any new physical results
        run: |
          test -d "$RUNNER_TEMP/historical/results/scored/pre_action"
          python train.py \
            --records "$RUNNER_TEMP/historical/results/scored" \
            --report "$RUNNER_TEMP/training-report.json" \
            --export-model "$RUNNER_TEMP/frozen-model.joblib"
          sha256sum "$RUNNER_TEMP/frozen-model.joblib" | cut -d' ' -f1 > "$RUNNER_TEMP/frozen-model.sha256"
          test -s "$RUNNER_TEMP/frozen-model.sha256"
      - name: Generate and independently verify new deterministic plan
        run: |
          python plan.py --version v3.1 --seed 20261129 --output plans/new-disjoint-test
          python - <<'PY'
          from collect import load_plan
          from plan import create_plan
          import hashlib,json, pathlib
          cs,ts=load_plan(pathlib.Path("plans/new-disjoint-test"))
          a,b=create_plan(seed=20261129,version="v3.1")
          assert (cs,ts)==(a,b)
          chosen=min((c for c in cs if c["partition"]=="test"),
                     key=lambda c:c["configuration_id"])
          selected=[i for i,t in enumerate(ts)
                    if t["configuration_id"]==chosen["configuration_id"]]
          assert len(selected)==12 and selected==list(range(selected[0],selected[0]+12))
          pathlib.Path("reports").mkdir(exist_ok=True)
          pathlib.Path("reports/new-config-start-index.txt").write_text(str(selected[0]))
          print("Preregistered selected test config", chosen["configuration_id"])
          PY
      - name: Generate distinct ephemeral lab credentials
        run: |
          for name in LAB_CONTROL_TOKEN LAB_ORACLE_TOKEN LAB_INTERNAL_TOKEN; do
            value="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start isolated 4-JVM authorization laboratory
        run: docker compose up --build -d
      - name: Verify live Java v2 telemetry reaches Python before physical trials
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from pilot import ENFORCERS, wait_ready, operator_telemetry
          wait_ready()
          readings = operator_telemetry(os.environ["LAB_CONTROL_TOKEN"])
          Path("reports").mkdir(exist_ok=True)
          Path("reports/operator-telemetry-preflight.json").write_text(
              json.dumps({"expected": len(ENFORCERS),
                          "observed": sum(x["observed"] for x in readings),
                          "records": readings}, indent=2) + "\\n")
          if len(readings) != len(ENFORCERS) or not all(x["observed"] for x in readings):
              raise RuntimeError("V2 telemetry integration failed; physical AI trial invalid")
          print("Observed live v2 operator telemetry from", len(readings), "enforcers")
          PY
      - name: Measure twelve NEW physical action replays and preserve negative outcomes
        run: |
          FIRST="$(cat reports/new-config-start-index.txt)"
          python campaign.py --execute-lab \
            --plan plans/new-disjoint-test \
            --records results/new-configuration \
            --start "$FIRST" --max-trials 12 > reports/new-config-batch.json
          python - <<'PY'
          import json
          d=json.load(open("reports/new-config-batch.json"))
          assert d["newly_executed_trials"]==12
          assert d["partial"]==0 and d["invalid"]==0
          print("Physical new-config action replays:",d["newly_executed_trials"])
          PY
      - name: Score frozen policy on new four-stream measured outcomes
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
        run: |
          MODEL_SHA="$(cat "$RUNNER_TEMP/frozen-model.sha256")"
          python new_configuration_pilot.py \
            --plan plans/new-disjoint-test \
            --records results/new-configuration \
            --historical-model "$RUNNER_TEMP/frozen-model.joblib" \
            --historical-model-sha256 "$MODEL_SHA" \
            --output reports/new-configuration-pilot.json
          python - <<'PY'
          import json
          d=json.load(open("reports/new-configuration-pilot.json"))
          assert d["status"]=="SMALL_NEW_CONFIGURATION_PILOT_NOT_SUPERIORITY_PROOF"
          assert d["paired_replays"]==3 and d["configuration_groups"]==1
          assert d["prospective_superiority_established"] is False
          print("AI abstention reasons:",d.get("abstention_reasons"))
          print("New-config pilot:",d["status"])
          for name, value in sorted(d["policies"].items()):
            print(name,round(value["mean_configuration_cost"],5),
                  "resolved:",value["successful_replays"],
                  "failed_requests:",value["failed_legitimate_requests"],
                  "budget_breaches:",value["observed_disruption_budget_breaches"])
          PY
      - name: Archive aggregate result and model training metadata, not raw oracle data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-config-physical-defense-pilot-report
          path: |
            experiment-b/mechanism-lab/reports/new-configuration-pilot.json
            experiment-b/mechanism-lab/reports/new-config-batch.json
            experiment-b/mechanism-lab/reports/operator-telemetry-preflight.json
            ${{ runner.temp }}/training-report.json
            ${{ runner.temp }}/frozen-model.sha256
          retention-days: 90
      - name: Archive restricted disposable lab streams separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-config-disposable-lab-physical-streams
          path: experiment-b/mechanism-lab/results/new-configuration
          retention-days: 7
      - name: Shut down disposable testbed
        if: always()
        run: docker compose down --remove-orphans --volumes
