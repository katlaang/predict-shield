name: Python evidence engine tests
on:
  push:
    paths:
      - 'engine/**'
      - '.github/workflows/python-engine-tests.yml'
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/python-engine-tests.yml'
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run evidence assessment unit tests
        run: PYTHONPATH=engine python -m unittest discover -s engine/tests -v
