name: Telecom read-only SNMPv3 and gNMI collectors
on:
  pull_request:
    paths:
      - 'engine/predict_shield/telecom_collectors.py'
      - 'engine/tests/test_telecom_collectors.py'
      - '.github/workflows/telecom-collectors-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=engine python -m unittest discover -s engine/tests -v
