name: Live lab AI decision integration contracts
on:
  pull_request:
    paths:
      - 'engine/predict_shield/lab_scope_evidence.py'
      - 'engine/tests/test_lab_scope_evidence.py'
      - 'experiment-b/mechanism-lab/lab_ai_decision.py'
      - 'experiment-b/mechanism-lab/test_lab_ai_decision.py'
      - '.github/workflows/lab-ai-decision-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'cryptography>=42' && PYTHONPATH=engine python -m unittest discover -s engine/tests -v
  model-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Verify actual model adapter wiring with synthetic unit fixtures
        working-directory: experiment-b/mechanism-lab
        run: PYTHONPATH=../../engine python -m unittest test_lab_ai_decision test_model_adapter -v
