name: Lab model-selected action and independent verification contracts
on:
  pull_request:
    paths:
      - 'experiment-b/mechanism-lab/lab_autonomous_execution.py'
      - 'experiment-b/mechanism-lab/test_lab_autonomous_execution.py'
      - 'experiment-b/mechanism-lab/lab_ai_decision.py'
      - '.github/workflows/lab-autonomous-execution-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Verify bounded lab actions and policy-constrained model bridge
        working-directory: experiment-b/mechanism-lab
        run: PYTHONPATH=../../engine python -m unittest test_lab_autonomous_execution test_lab_ai_decision test_model_adapter -v
