name: Exploratory chronological learned threat ranking
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'engine/predict_shield/chronological_model.py'
      - 'engine/tests/test_chronological_model.py'
      - 'docs/research/data/exploratory_model_windows_2026.json'
      - '.github/workflows/threat-chronological-model.yml'
jobs:
  exploratory-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned-major research model dependencies
        run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Run historical boundary tests
        run: PYTHONPATH=engine python -m unittest discover -s engine/tests -v
      - name: Fit only on earlier historical windows and compare October exploratory ranks
        run: |
          PYTHONPATH=engine python -m predict_shield.chronological_model \
            --manifest docs/research/data/exploratory_model_windows_2026.json \
            --output exploratory-chronological-rank-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("exploratory-chronological-rank-summary.json").read_text())
          assert d["october_previously_inspected_not_confirmatory"] is True
          assert d["future_kev_catalog_addition_is_only_proxy"] is True
          assert d["no_calibrated_probabilities"] is True
          assert d["sampled_training_positives"] > 0
          assert len(d["diagnostic_and_exploratory_windows"])==2
          print("Historical experiment completed; no confirmatory AI superiority claim")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exploratory-learned-threat-ranking
          path: exploratory-chronological-rank-summary.json
