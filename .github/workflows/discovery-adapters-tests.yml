name: Gateway and SBOM discovery adapter contracts
on:
  pull_request:
    paths:
      - 'engine/predict_shield/discovery_adapters.py'
      - 'engine/tests/test_discovery_adapters.py'
      - '.github/workflows/discovery-adapters-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run adapter and existing engine contracts
        run: PYTHONPATH=engine python -m unittest discover -s engine/tests -v
