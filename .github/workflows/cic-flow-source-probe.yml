name: CIC flow source probe

# Reachability probe only: lists where CIC-IDS2017 and CSE-CIC-IDS2018 can be
# fetched from a runner. Downloads nothing larger than a directory listing.

on:
  push:
    branches: [feat/cross-dataset-flow-detector]
    paths: ['.github/workflows/cic-flow-source-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: AWS open data bucket (CSE-CIC-IDS2018)
        run: |
          aws --version || true
          aws s3 ls --no-sign-request --region ca-central-1 "s3://cse-cic-ids2018/" || true
          aws s3 ls --no-sign-request --region ca-central-1 "s3://cse-cic-ids2018/Processed Traffic Data for ML Algorithms/" || true
      - name: Corrected-version listings and the 2017 publisher page
        run: |
          show() { echo "=== $1"; curl -sSL -m 60 -A 'Mozilla/5.0' "$1" -o page.html -w 'HTTP %{http_code} %{size_download} bytes\n' || true; }
          show "https://intrusion-detection.distrinet-research.be/CNS2022/Datasets/"
          sed -e 's/<[^>]*>/ /g' page.html | tr -s ' ' | grep -v '^\s*$' | head -60
          grep -o -i -E 'href="[^"]+"' page.html | head -60
          show "https://intrusion-detection.distrinet-research.be/CNS2022/Dataset_Download.html"
          sed -e 's/<[^>]*>/ /g' page.html | tr -s ' ' | grep -v '^\s*$' | head -30
          show "https://intrusion-detection.distrinet-research.be/WTMC2021/tools_datasets.html"
          sed -e 's/<[^>]*>/ /g' page.html | tr -s ' ' | grep -v '^\s*$' | head -60
          curl -sSIL -m 60 "https://intrusion-detection.distrinet-research.be/WTMC2021/Dataset/dataset.zip" | grep -i -E 'HTTP/|content-length|last-modified|content-type' || true
          show "http://cicresearch.ca/CICDataset/CIC-IDS-2017/"
          sed -e 's/<[^>]*>/ /g' page.html | tr -s ' ' | grep -v '^\s*$' | head -40
          grep -o -i -E '(href|action)="[^"]+"' page.html | head -30
