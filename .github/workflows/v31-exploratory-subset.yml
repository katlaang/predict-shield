name: Exploratory v3.1 audited five-group physical subset
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiment-b/mechanism-lab/pilot_v31_plan.py'
      - 'experiment-b/mechanism-lab/run_v31_subset.py'
      - 'experiment-b/mechanism-lab/test_v31_subset.py'
      - '.github/workflows/v31-exploratory-subset.yml'
permissions:
  contents: read
jobs:
  five-group-physical-subset:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create three distinct disposable test credentials
        run: |
          for key in LAB_CONTROL_TOKEN LAB_ORACLE_TOKEN LAB_INTERNAL_TOKEN; do
            value="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Verify preregistered manifest and no synthetic outcome tests
        working-directory: experiment-b/mechanism-lab
        run: python -m unittest test_v31_subset test_export_v31_pilot test_feasibility_v31 -v
      - name: Start isolated real Kafka, authority, gateway, four JVMs and oracle
        working-directory: experiment-b/mechanism-lab
        run: docker compose up --build -d
      - name: Execute 40 distinct physical replays, audit four streams, run group-level diagnostic
        working-directory: experiment-b/mechanism-lab
        run: |
          python run_v31_subset.py --execute-lab \
            --root /tmp/v31-exploratory-subset \
            --output reports/ci-v31-subset.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/ci-v31-subset.json").read_text())
          assert r["status"]=="EXPLORATORY_SUBSET_INCONCLUSIVE"
          assert r["executed_physical_replays"]==40
          assert r["pilot_configuration_groups"]==5
          assert r["paired_decision_instances"]==10
          assert r["final_v31_feasibility_evaluated"] is False
          assert r["no_trained_model_evaluated"] is True
          assert r["exclusion"]=="authority_outage not supported by full-state oracle"
          print("PASS: audited 40 physical replays across five independent pilot groups")
          print("Observed fixed-policy config mismatch",r["mismatched_configuration_groups"],"of",r["pilot_configuration_groups"])
          print("Partial-visibility group optima",r["partial_visibility_unique_optima"])
          print("Feasibility remains INCONCLUSIVE for the six-family study")
          PY
      - name: Upload sanitized diagnostics only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v31-exploratory-subset-diagnostics
          path: experiment-b/mechanism-lab/reports/ci-v31-subset.json
      - name: Remove private raw oracle, pre-action and operation records
        if: always()
        run: rm -rf /tmp/v31-exploratory-subset
      - name: Shutdown all disposable experiment services
        if: always()
        working-directory: experiment-b/mechanism-lab
        run: |
          docker compose ps
          docker compose logs --tail=60
          docker compose down --remove-orphans --volumes
