name: Telecom evidence graph contracts
on:
  pull_request:
    paths:
      - 'engine/predict_shield/telecom_graph.py'
      - 'engine/predict_shield/lldp_adapter.py'
      - 'engine/tests/test_telecom_graph.py'
      - '.github/workflows/telecom-graph-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete asset and research engine contracts
        run: PYTHONPATH=engine python -m unittest discover -s engine/tests -v
