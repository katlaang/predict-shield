name: Training-only stability from actual 1200-action physical lab results
on:
  pull_request:
    paths:
      - 'experiment-b/mechanism-lab/train_group_stability.py'
      - 'experiment-b/mechanism-lab/test_train_group_stability.py'
      - 'docs/research/TRAIN_ONLY_AI_STABILITY_2026_11_14.md'
      - '.github/workflows/train-only-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-training-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documented ML environment
        run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Test training-only model and grouping contracts, synthetic fixtures only
        working-directory: experiment-b/mechanism-lab
        run: PYTHONPATH=../../engine python -m unittest test_train_group_stability -v
      - name: Retrieve original physically audited v3 shard artifacts, without model result labels from test
        uses: actions/download-artifact@v4
        with:
          run-id: 43629488209
          github-token: ${{ github.token }}
          pattern: v3-physical-measured-shard-*
          path: /tmp/train-cv-original-shards
          merge-multiple: false
      - name: Repackage original audited artifact contents without changing data
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          for index in range(5):
              root=Path(f'/tmp/train-cv-original-shards/v3-physical-measured-shard-{index}')
              if not (root/f'shard-{index}.json').exists():
                  raise RuntimeError('Missing physically measured independent shard')
              with zipfile.ZipFile(f'/tmp/train-cv-{index}.zip','x') as archive:
                  for name in (f'shard-{index}.json', f'shard-{index}.sha256'):
                      archive.write(root/name,arcname=name)
          print('PASS: all five original physical shards available')
          PY
      - name: Refit fixed Extra Trees on TRAIN groups only and measure 25 grouped CV folds
        working-directory: experiment-b/mechanism-lab
        run: |
          python train_group_stability.py \
            --shard-zips /tmp/train-cv-0.zip /tmp/train-cv-1.zip /tmp/train-cv-2.zip \
                         /tmp/train-cv-3.zip /tmp/train-cv-4.zip \
            --output reports/ci-training-only-stability.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/ci-training-only-stability.json').read_text())
          assert d['group_validation_folds'] == 25
          assert d['train_only_independent_groups'] == 60
          assert d['provenance']['training_only_rows'] == 720
          assert d['provenance']['calibration_or_test_labels_used_for_selection'] is False
          assert d['test_or_calibration_used_for_training_selection'] is False
          assert d['confirmatory_superiority_established'] is False
          assert d['folds_ai_better_than_fixed_monitor'] + d['folds_ai_worse_than_fixed_monitor'] + d['folds_tied'] == 25
          print('REAL LAB TRAINING CV:',d['folds_ai_better_than_fixed_monitor'],
                'better;', d['folds_ai_worse_than_fixed_monitor'],
                'worse;',d['folds_tied'],'tied; scientific test proof: false')
          PY
      - name: Hash and retain full training-only diagnostic, including negative folds
        if: success()
        working-directory: experiment-b/mechanism-lab
        run: sha256sum reports/ci-training-only-stability.json > reports/ci-training-stability.sha256
      - name: Publish repeatable research training-only evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: actual-train-only-ai-stability
          path: |
            experiment-b/mechanism-lab/reports/ci-training-only-stability.json
            experiment-b/mechanism-lab/reports/ci-training-stability.sha256
          retention-days: 30
      - name: Remove original full shard copies and all temporary training artifacts
        if: always()
        run: rm -rf /tmp/train-cv-original-shards /tmp/train-cv-*.zip
