name: Frozen decision AI on 480 new physical actions across five fault families
on:
  pull_request:
    paths:
      - 'experiment-b/mechanism-lab/five_family_frozen_physical.py'
      - 'experiment-b/mechanism-lab/evaluate_five_family_frozen_ai.py'
      - 'experiment-b/mechanism-lab/test_five_family_frozen_ai.py'
      - '.github/workflows/frozen-five-family-physical-ai.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen-five-family-physical-ai-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  freeze-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned research dependencies
        run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Validate all 60 new physical test configurations and frozen scorer
        working-directory: experiment-b/mechanism-lab
        run: python -m unittest test_five_family_frozen_ai test_prospective_paired_actions test_paired_action_value_training -v
  five-new-physical-shards:
    needs: freeze-validate
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original Kafka physical mechanism dependencies
        run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Provision three distinct one-time disposable credentials
        run: |
          for name in LAB_CONTROL_TOKEN LAB_ORACLE_TOKEN LAB_INTERNAL_TOKEN; do
            token="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
            echo "::add-mask::$token"
            echo "$name=$token" >> "$GITHUB_ENV"
          done
      - name: Start actual Kafka, independent Java enforcers, read gateway and oracle
        working-directory: experiment-b/mechanism-lab
        run: |
          for attempt in 1 2 3; do
            if docker compose up --build -d; then exit 0; fi
            docker compose down --volumes --remove-orphans || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt*8)); fi
          done
          exit 1
      - name: Measure and four-stream audit 96 actual actions on one fresh physical fault family
        working-directory: experiment-b/mechanism-lab
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python five_family_frozen_physical.py \
            --execute-disposable-lab \
            --shard "$SHARD" \
            --root "/tmp/ps-five-family-new-private-$SHARD" \
            --output "reports/new-five-family-physical-$SHARD.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          shard=int(os.environ["SHARD"])
          data=json.loads(Path(f"reports/new-five-family-physical-{shard}.json").read_text())
          assert data["physical_replays_completed"]==96
          assert data["independent_new_configuration_groups"]==12
          assert data["independent_four_stream_audit_passed"] is True
          assert data["privileged_oracle_data_uploaded"] is False
          assert len(data["measured_physical_rows"])==96
          assert data["frozen_model_not_retrained"] is True
          if shard==4:
            assert all(r["consumer_pause_physically_witnessed"] is True
                       for r in data["measured_physical_rows"])
          print("Measured actual Kafka/JVM actions and separate oracle",shard,96)
          PY
      - name: Retain only independently audited sanitized real action measurements
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: five-family-frozen-physical-shard-${{ matrix.shard }}
          path: experiment-b/mechanism-lab/reports/new-five-family-physical-${{ matrix.shard }}.json
          retention-days: 30
      - name: Destroy raw privileged oracle data and lab resources
        if: always()
        working-directory: experiment-b/mechanism-lab
        run: |
          rm -rf "/tmp/ps-five-family-new-private-${{ matrix.shard }}" || true
          docker compose down --remove-orphans --volumes || true
  score-frozen-ai-and-seven-strong-rules:
    needs: five-new-physical-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unchanged model inference dependencies
        run: python -m pip install -r experiment-b/requirements-ml.txt
      - name: Obtain all five new actual physical fault-family measurements
        uses: actions/download-artifact@v4
        with:
          pattern: five-family-frozen-physical-shard-*
          path: /tmp/ps-five-new-physical
          merge-multiple: true
      - name: Obtain exact pretrained model frozen in original 1200-action development
        uses: actions/download-artifact@v4
        with:
          repository: katlaang/predict-shield
          run-id: 43682077804
          github-token: ${{ github.token }}
          name: paired-real-physical-action-value-model-and-historical-validation
          path: /tmp/ps-frozen-ai
      - name: Score every new physical action against all seven locked conventional policies
        working-directory: experiment-b/mechanism-lab
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python evaluate_five_family_frozen_ai.py \
            --shards /tmp/ps-five-new-physical/new-five-family-physical-0.json \
                     /tmp/ps-five-new-physical/new-five-family-physical-1.json \
                     /tmp/ps-five-new-physical/new-five-family-physical-2.json \
                     /tmp/ps-five-new-physical/new-five-family-physical-3.json \
                     /tmp/ps-five-new-physical/new-five-family-physical-4.json \
            --frozen-model /tmp/ps-frozen-ai/ps-paired-action-exploratory-model.joblib \
            --training-report /tmp/ps-frozen-ai/ps-paired-action-development-report.json \
            --output /tmp/ps-frozen-ai-five-family-480-physical.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/ps-frozen-ai-five-family-480-physical.json").read_text())
          assert r["new_physical_configuration_groups"]==60
          assert r["new_physical_action_replays"]==480
          assert r["new_physical_decisions_scored"]==120
          assert len(r["per_case_full_physical_decision_record"])==120
          assert r["same_trained_model_as_first_fresh_24_group_comparison"] is True
          assert r["old_24_group_results_reused_for_training_or_tuning"] is False
          assert r["new_experimental_outcomes_used_for_training_or_rule_selection"] is False
          assert r["strong_rule_locked_from_prior_historical_calibration"]=="fixed_monitor"
          assert len(r["all_seven_prespecified_comparator_statistics"])==7
          assert r["production_critical_infrastructure_effectiveness_established"] is False
          assert r["ai_accuracy_99_9_proven"] is False
          print("Frozen model assessed without retuning; positive and negative outcomes preserved.")
          PY
      - name: Publish entire new physical result including negative outcomes and budget failures
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-ai-five-fault-real-480-physical-actions-and-seven-rules
          path: /tmp/ps-frozen-ai-five-family-480-physical.json
          retention-days: 30
