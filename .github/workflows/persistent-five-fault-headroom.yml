name: Persistent five-family physical action headroom study
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiment-b/mechanism-lab/persistent_ai_plan.py'
      - 'experiment-b/mechanism-lab/run_persistent_five_pilot.py'
      - 'experiment-b/mechanism-lab/test_persistent_five_ai_plan.py'
      - '.github/workflows/persistent-five-fault-headroom.yml'
permissions:
  contents: read
concurrency:
  group: persistent-five-family-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  five-fault-physical-pilot:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 30 prospectively balanced configurations and no synthetic outcomes
        working-directory: experiment-b/mechanism-lab
        run: PYTHONPATH=../../engine python -m unittest test_persistent_five_ai_plan test_v31_subset test_authority_outage_witness -v
      - name: Generate distinct disposable masked lab credentials
        run: |
          for name in LAB_CONTROL_TOKEN LAB_ORACLE_TOKEN LAB_INTERNAL_TOKEN; do
            value="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start independent real Kafka authority gateway Java enforcers and oracle
        working-directory: experiment-b/mechanism-lab
        run: |
          for attempt in 1 2 3; do
            if docker compose up --build -d; then exit 0; fi
            docker compose down --remove-orphans --volumes || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt*8)); fi
          done
          exit 1
      - name: Run 240 physically witnessed defense actions, independently audit and measure decision headroom
        working-directory: experiment-b/mechanism-lab
        run: |
          python run_persistent_five_pilot.py --execute-lab \
            --root /tmp/physical-five-family-trials \
            --report reports/ci-persistent-five-physical.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("reports/ci-persistent-five-physical.json").read_text())
          assert d["physical_action_replays"]==240
          assert d["independent_configuration_groups"]==30
          assert d["fault_family_group_counts"]=={
            "loss":6,"delay":6,"duplicate":6,"reorder":6,"consumer_paused":6}
          assert d["four_streams_per_action_audited"] is True
          assert d["learned_AI_model_trained"] is False
          assert d["full_six_family_v31_feasibility_established"] is False
          assert d["audit"]["complete"]==240
          assert d["audit"]["missing"]==d["audit"]["partial"]==d["audit"]["invalid"]==0
          print("REAL OUTCOME -- fraction of groups where resync not near-optimal:",
                d["group_optima_resync_mismatch_fraction"])
          print("REAL OUTCOME -- uniquely best actions under 0.001 tolerance:",
                d["unique_near_optimal_action_counts"])
          print("No AI superiority claim from a fault-headroom feasibility experiment")
          PY
      - name: Hash audited sanitized group-level physical observations
        if: success()
        working-directory: experiment-b/mechanism-lab
        run: sha256sum reports/ci-persistent-five-physical.json > reports/ci-five-headroom.sha256
      - name: Publish only sanitized physical group-level costs, no private raw oracle records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-family-physical-decision-headroom-evidence
          path: |
            experiment-b/mechanism-lab/reports/ci-persistent-five-physical.json
            experiment-b/mechanism-lab/reports/ci-five-headroom.sha256
          if-no-files-found: warn
      - name: Remove raw privileged records and destroy disposable Java/Kafka lab
        if: always()
        working-directory: experiment-b/mechanism-lab
        run: |
          rm -rf /tmp/physical-five-family-trials
          export LAB_CONTROL_TOKEN="${LAB_CONTROL_TOKEN:-cleanup-only-control}"
          export LAB_ORACLE_TOKEN="${LAB_ORACLE_TOKEN:-cleanup-only-oracle}"
          export LAB_INTERNAL_TOKEN="${LAB_INTERNAL_TOKEN:-cleanup-only-internal}"
          docker compose down --remove-orphans --volumes || true
