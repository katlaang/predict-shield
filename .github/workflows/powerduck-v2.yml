name: PowerDuck GOOSE detector v2

# Learned anomaly detector for IEC 61850 GOOSE on the PowerDuck captures.
# See experiment-b/powerduck-v2/protocol_v2.json.
#   stage=develop  normal captures only: leave-one-capture-out report, fit,
#                  threshold, freeze; commits the freeze to the branch.
#   stage=test     verifies the committed freeze against the input hash and
#                  scores all 16 attack captures once; commits the report.

on:
  push:
    branches: [feat/powerduck-v2]
    paths: ['experiment-b/powerduck-v2/**', '.github/workflows/powerduck-v2.yml']
  workflow_dispatch:
    inputs:
      stage:
        description: 'develop or test'
        default: 'develop'
      freeze_sha256:
        description: 'test stage only: the freeze hash in experiment-b/powerduck-v2/frozen/freeze.json'
        default: ''

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'scikit-learn==1.7.2' 'numpy==2.3.4'
      - working-directory: experiment-b/powerduck-v2
        run: PYTHONPATH=../powerduck python -m unittest test_powerduck_v2 -v

  run:
    if: github.event_name == 'workflow_dispatch'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'scikit-learn==1.7.2' 'numpy==2.3.4'
      - name: Download the archive from Zenodo
        run: |
          for attempt in 1 2 3 4 5; do
            curl -sSL -m 60 -H 'Accept: application/json' -A 'predict-shield-ci' \
              "$(python -c "import json;print(json.load(open('experiment-b/powerduck-v2/protocol_v2.json'))['source']['record'])")" -o rec.json || true
            python3 -c "import json;json.load(open('rec.json'))" 2>/dev/null && break
            sleep $((attempt * 15))
          done
          url=$(python3 -c "import json;print(json.load(open('rec.json'))['files'][0]['links']['self'])")
          curl -fsSL --retry 5 --retry-all-errors -m 300 -A 'predict-shield-ci' -o "$RUNNER_TEMP/powerduck.zip" "$url"
          sha256sum "$RUNNER_TEMP/powerduck.zip"
      - name: Develop on normal captures and freeze
        if: github.event.inputs.stage == 'develop'
        working-directory: experiment-b/powerduck-v2
        run: |
          test ! -f frozen/freeze.json
          python detector_v2.py develop --archive "$RUNNER_TEMP/powerduck.zip" --out-dir frozen
          git config user.name katlaang
          git config user.email katlaang@users.noreply.github.com
          git add frozen
          git commit -m "powerduck-v2: record the freeze from develop run ${{ github.run_id }} before version 2 reads any attack capture"
          git push origin HEAD:${{ github.ref_name }}
      - name: Score the 16 attack captures once
        if: github.event.inputs.stage == 'test'
        working-directory: experiment-b/powerduck-v2
        run: |
          test ! -f frozen/test-report.json
          python detector_v2.py test --archive "$RUNNER_TEMP/powerduck.zip" --frozen-dir frozen \
            --expected-freeze-sha256 "${{ github.event.inputs.freeze_sha256 }}" --output frozen/test-report.json
          git config user.name katlaang
          git config user.email katlaang@users.noreply.github.com
          git add frozen/test-report.json
          git commit -m "powerduck-v2: record the second attack-capture measurement (run ${{ github.run_id }})"
          git push origin HEAD:${{ github.ref_name }}
