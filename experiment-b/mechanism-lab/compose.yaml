# Disposable multi-process authorization experiment. Never deploy publicly.
x-enforcer: &enforcer
  build: ./java
  restart: "no"
  environment: &shared
    LAB_ROLE: enforcer
    LAB_CONTROL_TOKEN: ${LAB_CONTROL_TOKEN:?Provide disposable control token}
    LAB_ORACLE_TOKEN: ${LAB_ORACLE_TOKEN:?Provide oracle token}
    LAB_INTERNAL_TOKEN: ${LAB_INTERNAL_TOKEN:?Provide internal token}
    LAB_AUTHORITY_URL: http://authority:8080
    SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:9092
    SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: latest
  depends_on: [broker, authority]
  networks: [lab]
services:
  broker:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.10
    command: ["redpanda", "start", "--mode", "dev-container", "--smp", "1", "--memory", "512M", "--reserve-memory", "0M", "--overprovisioned", "--kafka-addr", "internal://0.0.0.0:9092", "--advertise-kafka-addr", "internal://broker:9092"]
    networks: [lab]
  authority:
    build: ./java
    environment:
      LAB_ROLE: authority
      LAB_CONTROL_TOKEN: ${LAB_CONTROL_TOKEN:?Provide control token}
      LAB_INTERNAL_TOKEN: ${LAB_INTERNAL_TOKEN:?Provide internal token}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:9092
    depends_on: [broker]
    ports: ["127.0.0.1:18281:8080"]
    networks: [lab]
  enforcer-a:
    <<: *enforcer
    environment:
      <<: *shared
      LAB_INSTANCE: enforcer-a
    ports: ["127.0.0.1:18282:8080"]
  enforcer-b:
    <<: *enforcer
    environment:
      <<: *shared
      LAB_INSTANCE: enforcer-b
    ports: ["127.0.0.1:18283:8080"]
  enforcer-c:
    <<: *enforcer
    environment:
      <<: *shared
      LAB_INSTANCE: enforcer-c
    ports: ["127.0.0.1:18284:8080"]
  gateway:
    build: ./python
    command: ["python", "/app/gateway.py"]
    environment:
      LAB_CONTROL_TOKEN: ${LAB_CONTROL_TOKEN:?Provide control token}
      ENFORCERS: http://enforcer-a:8080,http://enforcer-b:8080,http://enforcer-c:8080
    depends_on: [enforcer-a, enforcer-b, enforcer-c]
    ports: ["127.0.0.1:18280:8080"]
    networks: [lab]
  oracle:
    build: ./python
    command: ["python", "/app/oracle.py"]
    environment:
      LAB_ORACLE_TOKEN: ${LAB_ORACLE_TOKEN:?Provide oracle token}
      LAB_INTERNAL_TOKEN: ${LAB_INTERNAL_TOKEN:?Provide internal token}
      ENFORCERS: http://enforcer-a:8080,http://enforcer-b:8080,http://enforcer-c:8080
      AUTHORITY_URL: http://authority:8080
    depends_on: [authority, enforcer-a, enforcer-b, enforcer-c]
    networks: [lab]
  runner:
    build: ./python
    command: ["python", "-c", "import time;time.sleep(3600)"]
    environment:
      LAB_CONTROL_TOKEN: ${LAB_CONTROL_TOKEN:?Provide control token}
      LAB_ORACLE_TOKEN: ${LAB_ORACLE_TOKEN:?Provide oracle token}
      LAB_INTERNAL_TOKEN: ${LAB_INTERNAL_TOKEN:?Provide internal token}
      AUTHORITY_URL: http://authority:8080
      ORACLE_URL: http://oracle:8080
      GATEWAY_URL: http://gateway:8080
      ENFORCERS: http://enforcer-a:8080,http://enforcer-b:8080,http://enforcer-c:8080
    depends_on: [gateway, oracle]
    networks: [lab]
networks:
  lab: {}
