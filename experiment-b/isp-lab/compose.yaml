# Real isolated Net-SNMPv3 management agents on virtual Ethernet.
# Not actual router firmware, optical transport, or real ISP infrastructure.
services:
  edge-a:
    build: ./agent
    environment:
      LAB_DEVICE_ID: edge-a
      LAB_SNMP_AUTH: ${LAB_SNMP_AUTH:?}
      LAB_SNMP_PRIV: ${LAB_SNMP_PRIV:?}
    ports: ["127.0.0.1:11611:161/udp"]
    networks: [isp]
  aggregation-b:
    build: ./agent
    environment:
      LAB_DEVICE_ID: aggregation-b
      LAB_SNMP_AUTH: ${LAB_SNMP_AUTH:?}
      LAB_SNMP_PRIV: ${LAB_SNMP_PRIV:?}
    ports: ["127.0.0.1:11612:161/udp"]
    networks: [isp]
  forgotten-c:
    build: ./agent
    environment:
      LAB_DEVICE_ID: forgotten-c
      LAB_SNMP_AUTH: ${LAB_SNMP_AUTH:?}
      LAB_SNMP_PRIV: ${LAB_SNMP_PRIV:?}
    ports: ["127.0.0.1:11613:161/udp"]
    networks: [isp]
  simulated-access:
    image: python:3.12-slim
    command: ["python", "/app/access_service.py"]
    volumes: ["./access_service.py:/app/access_service.py:ro"]
    environment:
      LAB_ACCESS_TOKEN: ${LAB_ACCESS_TOKEN:?}
    ports: ["127.0.0.1:18310:8080"]
    networks: [isp]
networks:
  isp: {}
