frr defaults traditional
hostname core1
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 ip address 10.0.2.2/30
 ip ospf network point-to-point
!
interface eth2
 ip address 10.0.3.1/30
 ip ospf network point-to-point
!
interface eth3
 ip address 100.64.0.1/24
!
router ospf
 ospf router-id 10.255.0.2
 network 10.255.0.2/32 area 0
 network 10.0.2.0/30 area 0
 network 10.0.3.0/30 area 0
 network 100.64.0.0/24 area 0
!
router bgp 65100
 bgp router-id 10.255.0.2
 neighbor 10.255.0.1 remote-as 65100
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.3 remote-as 65100
 neighbor 10.255.0.3 update-source lo
 address-family ipv4 unicast
  network 100.64.0.0/24
  neighbor 10.255.0.1 route-reflector-client
  neighbor 10.255.0.3 route-reflector-client
 exit-address-family
!
