frr defaults traditional
hostname pe2
!
interface lo
 ip address 10.255.0.3/32
!
interface eth1
 ip address 10.0.3.2/30
 ip ospf network point-to-point
!
interface eth2
 ip address 10.0.4.1/30
!
router ospf
 ospf router-id 10.255.0.3
 network 10.255.0.3/32 area 0
 network 10.0.3.0/30 area 0
!
router bgp 65100
 bgp router-id 10.255.0.3
 no bgp ebgp-requires-policy
 neighbor 10.0.4.2 remote-as 65200
 neighbor 10.255.0.2 remote-as 65100
 neighbor 10.255.0.2 update-source lo
 address-family ipv4 unicast
  neighbor 10.255.0.2 next-hop-self
  neighbor 10.0.4.2 soft-reconfiguration inbound
 exit-address-family
!
